
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>WASL | وصل</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: #172438;
      border-bottom: 1px solid #30415a;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      color: #d6b56d;
      letter-spacing: 3px;
    }

    header p {
      color: #aab7c9;
      margin-top: 10px;
    }

    main {
      max-width: 850px;
      margin: 45px auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 35px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #aab7c9;
      line-height: 1.8;
    }

    .portals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .portal {
      background: #1c2b40;
      border: 1px solid #344861;
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
      transition: .2s;
    }

    .portal:hover {
      border-color: #d6b56d;
      transform: translateY(-4px);
    }

    .portal .icon {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .portal h2 {
      color: #d6b56d;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .portal p {
      color: #b7c2d0;
      line-height: 1.7;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #8493a8;
      padding: 30px 15px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">WASL</div>
    <p>منصة وصل للخدمات المتكاملة</p>
  </header>

  <main>
    <section class="welcome">
      <h1>مرحباً بك في وصل</h1>
      <p>منصة واحدة تجمع الخدمات في تجربة رقمية موحدة.</p>
    </section>

    <section class="portals">
      <div class="portal">
        <div class="icon">👤</div>
        <h2>بوابة العملاء</h2>
        <p>الوصول إلى الخدمات ومتابعة الطلبات.</p>
      </div>

      <div class="portal">
        <div class="icon">🏢</div>
        <h2>بوابة المؤسسات</h2>
        <p>إدارة المؤسسات والخدمات والطلبات.</p>
      </div>

      <div class="portal">
        <div class="icon">⚙️</div>
        <h2>بوابة الإدارة</h2>
        <p>إدارة المنصة والتحكم في الصلاحيات.</p>
      </div>
    </section>
  </main>

  <footer>
    WASL © 2026 - جميع الحقوق محفوظة
  </footer>
</body>
</html>
